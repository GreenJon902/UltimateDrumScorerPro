<!DOCTYPE html>
<html>
    <head>
        <title>UDSP</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
    
		<svg id="drums" xmlns="http://www.w3.org/2000/svg" style="display: none;">
			<defs id="defs">
				<g id="high-hat" data-size-up="0" data-size-down="5" data-size-left="5" data-size-right="0" data-beam-spacing="5">
					<path d="M-5 5 L0 0 M-5 0 L0 5"/>
				</g>
				
				<g id="snare" data-size-up="0" data-size-down="5" data-size-left="5" data-size-right="0" data-beam-spacing="5">
					<path d="M-5 5 L0 0"/>
				</g>
				
				<g id="snare2" data-size-up="0" data-size-down="5" data-size-left="5" data-size-right="0" data-beam-spacing="7">
					<use href="#snare"/>
				</g>
			
				<g id="kick" data-size-up="0" data-size-down="5" data-size-left="5" data-size-right="0" data-beam-spacing="15">
					<use href="#snare"/>
				</g>
			</defs>
		</svg>
    	
    
        <div id="rendered-pane">
            <div id="component-container">
				<svg viewBox="-10 -10 20 20" style="width:20mm; height:20mm;"> 	
					<use href="drums.svg#high-hat">
				</svg>
            </div>
        </div>
        <div id="editor-pane">

        </div>
    </body>
    
    <script type="module">
    import {loadJSON} from "./files.js";
    loadJSON({"drums":{"kick":{"symbol":"slanted-line","y":0},"snare":{"symbol":"slanted-line","y":10}},"decorations":{"high-hat-open":{"symbol":"+"},"high-hat-close":{"symbol":"o"}},"text-components":{"text-component-0":{"x":10,"y":30,"font-size":13,"text":"TestingTesting123"}},"score-components":{"score-component-0":{"x":0.1,"y":0.1,"time-signature-denomenator":4,"enabled-decorations":["high-hat-open","high-hat-closed"],"enabled-drums":["kick", "snare", "snare2"]/*["crash", "ride", "hi-hat", "high-rack-tom", "low-rack-tom", "snare", "kick"]*/,"score-content":[
    [{"drums":["kick", "snare"],"decorations":[]}, {"drums":[],"decorations":[]}
    ], [{"drums":[],"decorations":[]}, {"drums":[],"decorations":[]}
    ], [{"drums":[],"decorations":[]}, {"drums":[],"decorations":[]}
    ], [{"drums":[],"decorations":[]}, {"drums":[],"decorations":[]}
    ]]}}});

    import {setEditComponent} from "./editor.js";
    setEditComponent("score-component", "score-component-0")
    import {renderComponent} from "./rendered.js";
    renderComponent("score-component", "score-component-0");
    //renderComponent("score-component", "score-component-1");

    </script> 
</html>
