<!DOCTYPE html>
<html>
    <head>
        <title>UDSP</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
		<input type="file" id="pdfInput" accept="application/pdf" style="display: none;" />
    
        <div id="rendered-pane">
        	<div id="component-controls">
	    		<button type="button" onclick="newScoreComponent()">+S</button>
	    		<button type="button" onclick="newTextComponent()">+T</button>
	    	</div>
	    	<div id="file-controls">
	    		<button type="button" onclick="saveProject()">Save</button>
	    		<button type="button" onclick="loadProject()">Load</button>
	    	</div>
        	<div id="rendered-pane-padding" onwheel="handleRenderedScroll(event)">
			    <div id="component-container-container">
                    <div id="component-container" onmousedown="handleCompContMouseDown(event)" onmousemove="handleCompContMouseMove(event)" onmouseup="handleCompContMouseUp(event)">
                    </div>
                </div>
	        </div>
        </div>
		<div id="editor-pane">
		</div>
    </body>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/3.0.1/jspdf.umd.min.js"></script>
    <script type="module">
        import {ComponentManager} from "./componentManager.js";
        import {SelectionManager} from "./selectionManager.js";
        import {DragManager} from "./dragManager.js";
        import {Symbols} from "./symbols.js";
        import {attachEditor} from "./editor.js";
        import {attachRendered} from "./rendered.js";
        
        // DEBUG STUFF -------------
        window.CM = ComponentManager;
        window.SM = SelectionManager;
        window.DM = DragManager;
        window.S = Symbols;
        // -------------------------
        
        ComponentManager.loadEmptyProject();
        const id = ComponentManager.createEmptyComponent("score-component");
        //const id = ComponentManager.createEmptyComponent("text-component");
        SelectionManager.select(id);
        ComponentManager.toggleComponentDrumEnabledState("component-0", "snare");
        ComponentManager.toggleComponentDrumEnabledState("component-0", "snare_flam");
        ComponentManager.toggleComponentDrumEnabledState("component-0", "snare_ghost");
        ComponentManager.toggleComponentDrumEnabledState("component-0", "kick");
        ComponentManager.addSubdivisions("component-0", 2, 0, 1, 2, 3, 4, 5);
        ComponentManager.addBeats("component-0", 64, 3);
        ComponentManager.addBeats("component-0", 3, 5);
        ComponentManager.addBeats("component-0", 3, 6);
        ComponentManager.addSubdivisions("component-0", 4, 0, 1, 2, 3);
        ComponentManager.toggleComponentDrum("component-0", 0, 0, "kick");
        ComponentManager.toggleComponentDrum("component-0", 1, 1, "snare");
        ComponentManager.toggleComponentDrum("component-0", 2, 0, "snare_flam");
        ComponentManager.toggleComponentDrum("component-0", 2, 0, "snare_ghost");
        ComponentManager.toggleComponentDrum("component-0", 2, 7, "kick");
        ComponentManager.toggleComponentDrum("component-0", 3, 0, "kick");
        ComponentManager.toggleComponentDrum("component-0", 3, 53, "kick");
        ComponentManager.toggleComponentDrum("component-0", 4, 0, "kick");
        ComponentManager.toggleComponentDrum("component-0", 4, 4, "kick");
        ComponentManager.toggleComponentDrum("component-0", 5, 0, "kick");
        ComponentManager.toggleComponentDrum("component-0", 5, 1, "kick");
        ComponentManager.toggleComponentDrum("component-0", 6, 0, "kick");
        ComponentManager.addBeats("component-0", 8, 2);
        ComponentManager.toggleComponentDrum("component-0", 2, 0, "kick");
        ComponentManager.toggleComponentDrum("component-0", 2, 2, "kick");
        ComponentManager.toggleComponentDrum("component-0", 2, 4, "kick");
        
        
        attachEditor(document.getElementById("editor-pane"));
        attachRendered(document.getElementById("component-container"));
        
        
        




        function updateRenderedScale(newScale) {
            // Update the zoom and all related properties of the rendered pane

            const cont = document.getElementById("component-container");
            const contcont = document.getElementById("component-container-container");
            
            // Save new value
            contcont.setAttribute("data-scale", newScale);

            // Put new scale in css
            document.getElementById("component-container").style.transform = `scale(${newScale})`;
            
            // Update size of contcont to be the scaled size of cont
            const rect = cont.getBoundingClientRect();
            contcont.style.width = rect.width + "px";
            contcont.style.height = rect.height + "px";
        }
        
        
        // Global bindings
        document.addEventListener("keydown", function(keydownEvent) {
            const mouseOverRendered = document.getElementById("rendered-pane").matches(":hover");
            
            // If Ctrl+0 pressed when mouse over rendered view then reset zoom
            if (keydownEvent.ctrlKey && String.fromCharCode(keydownEvent.keyCode) == "0" && mouseOverRendered) {
                keydownEvent.preventDefault();
                updateRenderedScale(1);
            
            // If shift pressed while in drag mode 
            } else if (keydownEvent.key === "Shift" && DragManager.isDragging()) {
                DragManager.setCardinal(true);
            }
        });
        document.addEventListener("keyup", function(keyupEvent) {
            // If shift pressed while in drag mode 
            if (keyupEvent.key === "Shift" && DragManager.isDragging()) {
                DragManager.setCardinal(false);
            }
        });

        // Functions for buttons, declare as window. so is accessable in their scope
        window.handleRenderedScroll = function(wheelEvent) {
            // If ctrl pressed: Zooms the rendered pane in or out depending on the given value. Then preventDefault event.
            // Else: Ignore event.
            
            if (wheelEvent.ctrlKey) {  // Only zoom if ctrl pressed
                wheelEvent.preventDefault();  // Stop page from scrolling
                
                const zoomSpeed = 0.001;
                
                const cont = document.getElementById("component-container");
                const contcont = document.getElementById("component-container-container");
                const scroll = document.getElementById("rendered-pane-padding");
                
                // Get new scale amount
                if (!contcont.hasAttribute("data-scale")) contcont.setAttribute("data-scale", "1");  // Set default value if it's not there yet
                const oldScale = contcont.getAttribute("data-scale");
                const newScale = Math.max(0, oldScale - wheelEvent.deltaY * zoomSpeed);  // Max as can't be negative
                
                // Actually set scale amount to node
                updateRenderedScale(newScale);
                
                // We want to zoom around the mouse, so update the scrolls of rendered-pane-padding accordingly
                const xBefore = (wheelEvent.pageX - cont.getBoundingClientRect().left) / oldScale;
                const xAfter = (wheelEvent.pageX - cont.getBoundingClientRect().left) / newScale;
                scroll.scrollLeft -= (xAfter - xBefore) * newScale;
                const yBefore = (wheelEvent.pageY - cont.getBoundingClientRect().top) / oldScale;
                const yAfter = (wheelEvent.pageY - cont.getBoundingClientRect().top) / newScale;
                scroll.scrollTop -= (yAfter - yBefore) * newScale;
            }
            
        }
        window.handleCompContMouseDown = function(event) {
            // When the mouse is pressed down on the component container (or one of its children), then we may have to initiate a drag.
            // This should be called by the onmousedown event of the componentContainer - the direct parent of the components.

            const cont = document.getElementById("component-container");

            if (event.target === cont) {  // If the target is the container then no component was pressed
                // Ignore this case

            } else if (event.button == 0) {  // If the target is not the container then a component was clicked on. And also is a left-click
                const cardinal = event.shiftKey;
                const svg = getSvgFromSvgOrChild(event.target);
                const compId = svg.dataset.componentId;  // Id of the component that was clicked on
                DragManager.startDrag(cardinal, compId);
            }
        }
        window.handleCompContMouseMove = function(event) {
            // When the mouse is moved on the component container (or one of its children), then we may have a drag.
            // This should be called by the onmousemove event of the componentContainer - the direct parent of the components.
            
            if (DragManager.isDragging()) {
            
                if (event.buttons % 2 !== 1) {
                    // Click has been released (while not over the compcont), so end the drag and return
                    DragManager.endDrag();
                    return;
                }
                
                // The delta is event.movement(XY). We need to convert this to mm
                const bbox = document.getElementById("component-container").getBoundingClientRect();
                const deltaX = event.movementX / bbox.width * 210;  // Page is 210x297mm
                const deltaY = event.movementY / bbox.height * 297;

                DragManager.moveDrag(deltaX, deltaY);
            }
        }
        window.handleCompContMouseUp = function (event) {
            // When the mouse is released on the component container (or one of its children), then we want update the selection or end a drag.
            // This should be called by the onmouseup event of the componentContainer - the direct parent of the components.
            
            const cont = document.getElementById("component-container");

            if (DragManager.isDragging() && DragManager.endDrag() && event.button === 0) {  // Was dragging and was drag significant and is a left-click
                // Nothing to do here

            } else if (event.button === 0) {  // Not dragging and is a left-click
                // Didn't actually drag so instead register it as a click

                if (event.target === cont) {  // If the target is the container then no component was pressed
                    // Set selection to none
                    SelectionManager.clearSelection()
                
                } else {  // If the target is not the container then a component was clicked on.
                    
                    const svg = getSvgFromSvgOrChild(event.target);
                    const compId = svg.dataset.componentId;  
                    const multiselect = event.shiftKey;
                    SelectionManager.toggleSelectionState(compId, multiselect);
                }
            }
        }
        window.newScoreComponent = function() {
            // Create a new score component and set it as selected.
            // This puts some default data in.
            const id = ComponentManager.createEmptyComponent("score-component");
            ComponentManager.toggleComponentDrumEnabledState(id, "kick");  // Hope these are all present in symbols ;)
            ComponentManager.toggleComponentDrumEnabledState(id, "snare");
            ComponentManager.toggleComponentDrumEnabledState(id, "hi-hat");
            SelectionManager.select(id);
        }
        window.newTextComponent = function() {
            // Create a new score component and set it as selected.
            // This puts some default data in.
            const id = ComponentManager.createEmptyComponent("text-component");
            ComponentManager.setComponentText(id, "Hello World!");
            SelectionManager.select(id);
            
        }
        

        function getSvgFromSvgOrChild(node) {
            // If node is a svg then it is returned, otherwise that nearest parent svg is returned.
            return (node.nodeName.toUpperCase() === "SVG") ? node : node.ownerSVGElement;  
        }












        // BROKEN: ---------------------------------
        window.saveProject = function() {
            // Saves the project as a PDF with all the content, and with some metadata to allow the pdf to be imported back into the program.
            // This will open a prompt to ask the user for a file name.
            const fileName = window.prompt("File name:");
            if (fileName === null) {
                return;  // Assume doesn't want to save
            }
            nodeToPDF(document.getElementById("component-container"), fileName);
        }
        window.loadProject = function() {
            // Load a pdf containing project metadata back into the program.
            // This sends a click event to a fileinput node with id "pdfInput".
            document.getElementById('pdfInput').click();
        }
        document.getElementById('pdfInput').addEventListener('change', () => {  // The actual binding for when we need to read a pdf
            const fileInput = document.getElementById('pdfInput');
            if (fileInput.files.length === 0) {
                throw "No files submitted";
            } else if (fileInput.files.length > 1) {
                throw "Too many files submitted";
            } else {
                const reader = new FileReader();
                
                reader.onload = function (e) {  // Actually load result
                
                    // Load result into files.js
                    const binaryString = e.target.result;
                    try {
                        loadMetaFromPDFString(binaryString);
                    } catch (err) {
                        alert("Failed to load file: " + err);
                    }
                    
                    // Clear old rendered data and re-render new
                    const componentContainer = document.getElementById("component-container");
                    Array.from(componentContainer.children).forEach(c => c.remove());  // Remove all children
                    setEditComponent("", "");  // Edit nothing
                    listComponents().forEach(args => renderComponent(args[0], args[1]));
                    
                };
                
                // Read file, this will result in the onload getting called.
                reader.readAsBinaryString(fileInput.files[0]);
            }
        });
    </script> 
</html>
