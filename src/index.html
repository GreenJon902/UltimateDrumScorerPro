<!DOCTYPE html>
<html>
    <head>
        <title>UDSP</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
		<svg id="text-svg" xmlns="http://www.w3.org/2000/svg" style="visibility: hidden; height: 1mm;">
		</svg>
		
		<input type="file" id="pdfInput" accept="application/pdf" style="display: none;" />
    
        <div id="rendered-pane">
        	<div id="component-controls">
	    		<button type="button" onclick="newScoreComponent()">+S</button>
	    		<button type="button" onclick="newTextComponent()">+T</button>
	    	</div>
	    	<div id="file-controls">
	    		<button type="button" onclick="saveProject()">Save</button>
	    		<button type="button" onclick="loadProject()">Load</button>
	    	</div>
        	<div id="rendered-pane-padding" onwheel="handleRenderedScroll(event)">
			    <div id="component-container-container">
                    <div id="component-container">
                    </div>
                </div>
	        </div>
        </div>
		<div id="editor-pane">
		</div>
    </body>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/3.0.1/jspdf.umd.min.js"></script>
    <script type="module">
        import {ComponentManager} from "./componentManager.js";
        import {SelectionManager} from "./selectionManager.js";
        import {attachEditor} from "./editor.js";
        import {attachRendered} from "./rendered.js";
        
        // DEBUG STUFF -------------
        window.CM = ComponentManager;
        window.SM = SelectionManager;
        // -------------------------
        
        ComponentManager.loadEmptyProject();
        const id = ComponentManager.createEmptyComponent("score-component");
        //const id = ComponentManager.createEmptyComponent("text-component");
        SelectionManager.select(id);
        ComponentManager.toggleComponentDrumEnabledState("component-0", "snare");
        ComponentManager.toggleComponentDrumEnabledState("component-0", "kick");
        
        attachEditor(document.getElementById("editor-pane"));
        //attachRendered(document.getElementById("component-container"));
        
        
        




        function updateRenderedScale(newScale) {
            // Update the zoom and all related properties of the rendered pane

            const cont = document.getElementById("component-container");
            const contcont = document.getElementById("component-container-container");
            
            // Save new value
            contcont.setAttribute("data-scale", newScale);

            // Put new scale in css
            document.getElementById("component-container").style.transform = `scale(${newScale})`;
            
            // Update size of contcont to be the scaled size of cont
            const rect = cont.getBoundingClientRect();
            contcont.style.width = rect.width + "px";
            contcont.style.height = rect.height + "px";
        }
        
        
        // Global bindings
        document.addEventListener("keydown", function(keydownEvent) {
            const mouseOverRendered = document.getElementById("rendered-pane").matches(":hover");
            
            // If Ctrl+0 pressed when mouse over rendered view then reset zoom
            if (keydownEvent.ctrlKey && String.fromCharCode(keydownEvent.keyCode) == "0" && mouseOverRendered) {
                keydownEvent.preventDefault();
                updateRenderedScale(1);
            }
        });

        // Functions for buttons, declare as window. so is accessable in their scope
        window.handleRenderedScroll = function(wheelEvent) {
            // If ctrl pressed: Zooms the rendered pane in or out depending on the given value. Then preventDefault event.
            // Else: Ignore event.
            
            if (wheelEvent.ctrlKey) {  // Only zoom if ctrl pressed
                wheelEvent.preventDefault();  // Stop page from scrolling
                
                const zoomSpeed = 0.001;
                
                const cont = document.getElementById("component-container");
                const contcont = document.getElementById("component-container-container");
                const scroll = document.getElementById("rendered-pane-padding");
                
                // Get new scale amount
                if (!contcont.hasAttribute("data-scale")) contcont.setAttribute("data-scale", "1");  // Set default value if it's not there yet
                const oldScale = contcont.getAttribute("data-scale");
                const newScale = Math.max(0, oldScale - wheelEvent.deltaY * zoomSpeed);  // Max as can't be negative
                
                // Actually set scale amount to node
                updateRenderedScale(newScale);
                
                // We want to zoom around the mouse, so update the scrolls of rendered-pane-padding accordingly
                const xBefore = (wheelEvent.pageX - cont.getBoundingClientRect().left) / oldScale;
                const xAfter = (wheelEvent.pageX - cont.getBoundingClientRect().left) / newScale;
                scroll.scrollLeft -= (xAfter - xBefore) * newScale;
                const yBefore = (wheelEvent.pageY - cont.getBoundingClientRect().top) / oldScale;
                const yAfter = (wheelEvent.pageY - cont.getBoundingClientRect().top) / newScale;
                scroll.scrollTop -= (yAfter - yBefore) * newScale;
            }
            
        }
        window.deselectComponents = function() {
            // Set current edit to none.
            setEditComponent("", "");
        }
        window.newScoreComponent = function() {
            // Create a new score component, render it and set it as the current edit.
            const id = createNewScoreComponent();
            renderComponent("score-component", id);
            setEditComponent("score-component", id);
        }
        window.newTextComponent = function() {
            // Create a new text component, render it and set it as the current edit.
            const id = createNewTextComponent();
            renderComponent("text-component", id);
            setEditComponent("text-component", id);
        }
        window.saveProject = function() {
            // Saves the project as a PDF with all the content, and with some metadata to allow the pdf to be imported back into the program.
            // This will open a prompt to ask the user for a file name.
            const fileName = window.prompt("File name:");
            if (fileName === null) {
                return;  // Assume doesn't want to save
            }
            nodeToPDF(document.getElementById("component-container"), fileName);
        }
        window.loadProject = function() {
            // Load a pdf containing project metadata back into the program.
            // This sends a click event to a fileinput node with id "pdfInput".
            document.getElementById('pdfInput').click();
        }
        document.getElementById('pdfInput').addEventListener('change', () => {  // The actual binding for when we need to read a pdf
            const fileInput = document.getElementById('pdfInput');
            if (fileInput.files.length === 0) {
                throw "No files submitted";
            } else if (fileInput.files.length > 1) {
                throw "Too many files submitted";
            } else {
                const reader = new FileReader();
                
                reader.onload = function (e) {  // Actually load result
                
                    // Load result into files.js
                    const binaryString = e.target.result;
                    try {
                        loadMetaFromPDFString(binaryString);
                    } catch (err) {
                        alert("Failed to load file: " + err);
                    }
                    
                    // Clear old rendered data and re-render new
                    const componentContainer = document.getElementById("component-container");
                    Array.from(componentContainer.children).forEach(c => c.remove());  // Remove all children
                    setEditComponent("", "");  // Edit nothing
                    listComponents().forEach(args => renderComponent(args[0], args[1]));
                    
                };
                
                // Read file, this will result in the onload getting called.
                reader.readAsBinaryString(fileInput.files[0]);
            }
        });
    </script> 
</html>
