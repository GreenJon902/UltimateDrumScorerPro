<!DOCTYPE html>
<html>
    <head>
        <title>UDSP</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
    
		<svg id="drums" xmlns="http://www.w3.org/2000/svg" style="display: none;">
			<defs id="defs">
				<g id="crash" data-size-up="1" data-size-down="4" data-size-left="4" data-size-right="1" data-beam-spacing="0">
					<path d="M0 0 L-3 3 M-3 0 L0 3 M-4 1.5 L1 1.5 M-1.5 -1 L-1.5 4"/>
				</g>
				<g id="ride" data-size-up="0" data-size-down="3" data-size-left="5" data-size-right="0" data-beam-spacing="2.5">
					<path d="M-5 3 L0 0 M-5 0 L0 3"/>
				</g>
				<g id="hi-hat" data-size-up="0" data-size-down="5" data-size-left="5" data-size-right="0" data-beam-spacing="5">
					<path d="M-5 5 L0 0 M-5 0 L0 5"/>
				</g>
				
				<g id="snare" data-size-up="0" data-size-down="5" data-size-left="5" data-size-right="0" data-beam-spacing="10">
					<path d="M-5 5 L0 0"/>
				</g>
				
				<g id="snare2" data-size-up="0" data-size-down="5" data-size-left="5" data-size-right="0" data-beam-spacing="7">
					<use href="#snare"/>
				</g>
			
				<g id="kick" data-size-up="0" data-size-down="5" data-size-left="5" data-size-right="0" data-beam-spacing="20">
					<use href="#snare"/>
				</g>
			</defs>
		</svg>
		<svg id="decorations" xmlns="http://www.w3.org/2000/svg" style="display: none;">
			<defs id="defs">
				<g id="open" data-width="3" data-height="3">
					<circle cx="0" cy="0" r="1" style="stroke: black; fill: none;"/>
				</g>
				<g id="closed" data-width="3" data-height="3">
					<path d="M-1.5 0 L1.5 0 M0 -1.5 L0 1.5"/>
				</g>
				<g id="accent" data-width="4" data-height="2">
					<path d="M-2 -1 L2 0 L-2 1"/>
				</g>
			</defs>
		</svg>
		<svg id="side-decorations" xmlns="http://www.w3.org/2000/svg" style="display: none;">
			<defs id="defs">
				<g id="start" data-width="5" data-height="15" data-side="left">
					<path d="M-5 -7.5 l0 15 M-3 -3 l0 6"/>
					<circle cx="-1" cy="-1.5" r="0.6"/>
					<circle cx="-1" cy="1.5" r="0.6"/>
				</g>
				<g id="repeat-start" data-width="6" data-height="20" data-side="left">
					<use href="#start" transform="translate(1 0)"/>
					<path d="M-6 -7 l6 -3 M-6 7 l6 3"/>
				</g>
				<g id="option-start" data-width="3" data-height="20" data-side="left">
					<path d="M0 -10 q-5 10 0 20"/>
				</g>

				<g id="end" data-width="5" data-height="15" data-side="right">
					<use href="#start" transform="scale(-1 1) translate(5 0)"/>
				</g>
				<g id="repeat-end" data-width="6" data-height="20" data-side="right">
					<use href="#repeat-start" transform="scale(-1 1) translate(6 0)"/>
				</g>
				<g id="option-end" data-width="1" data-height="20" data-side="right">
					<use href="#option-start" transform="scale(-1 1) translate(1 0)"/>
				</g>
				<g id="bar-end" data-width="0" data-height="15" data-side="right">
					<path d="M0 -7.5 l0 15"/>
				</g>
			</defs>
		</svg>
		
		<svg id="text-svg" xmlns="http://www.w3.org/2000/svg" style="visibility: hidden; height: 1mm;">
		</svg>
		
		<input type="file" id="pdfInput" accept="application/pdf" style="display: none;" />
    	
    
        <div id="rendered-pane">
        	<div id="component-controls">
	    		<button type="button" onclick="newScoreComponent()">+S</button>
	    		<button type="button" onclick="newTextComponent()">+T</button>
	    	</div>
	    	<div id="file-controls">
	    		<button type="button" onclick="saveProject()">Save</button>
	    		<button type="button" onclick="loadProject()">Load</button>
	    	</div>
        	<div id="rendered-pane-padding">
			    <div id="component-container">
			    </div>
	        </div>
        </div>
		<div id="editor-pane">

		</div>
    </body>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/3.0.1/jspdf.umd.min.js"></script>
    


    <script type="module">
        import {renderComponent} from "./rendered.js";
        import {loadJSON, createNewScoreComponent, createNewTextComponent, listComponents} from "./files.js";
        import {setEditComponent} from "./editor.js";
        import {nodeToPDF, loadMetaFromPDFString} from "./print.js";
        
        // Load temp project during dev and setup
        
        loadJSON({"drums":{"kick":{"symbol":"slanted-line","y":0},"snare":{"symbol":"slanted-line","y":10}},"decorations":{"high-hat-open":{"symbol":"+"},"high-hat-close":{"symbol":"o"}},"text-components":{"text-component-0":{"x":10,"y":30,"font-size":13,"text":"TestingTesting123"}},"score-components":{"score-component-0":{"x":0.1,"y":0,"time-signature-denomenator":4,"enabled-decorations":["open","closed"],"rhythm-length-hint":30, "enabled-drums":/*["kick", "snare", "snare2"]*/["crash", "ride", "hi-hat", /*"high-rack-tom", "low-rack-tom", */"snare", "kick"],"score-content":[
        [{"drums":[],"decorations":[]}, {"drums":[],"decorations":[]}
        ], [{"drums":[],"decorations":[]}, {"drums":[],"decorations":[]}
        ], [{"drums":[],"decorations":[]}, {"drums":[],"decorations":[]}
        ], [{"drums":[],"decorations":[]}, {"drums":[],"decorations":[]}
        ]], "left-decoration": "", "right-decoration": ""}/*, "score-component-1":{"x":0.1,"y":0.1,"time-signature-denomenator":4,"enabled-decorations":["high-hat-open","high-hat-closed"],"rhythm-length-hint":1, "enabled-drums":["crash", "ride", "hi-hat", "high-rack-tom", "low-rack-tom", "snare", "kick"],"score-content":[
        [{"drums":[],"decorations":[]}, {"drums":[],"decorations":[]}
        ], [{"drums":[],"decorations":[]}, {"drums":[],"decorations":[]}
        ], [{"drums":[],"decorations":[]}, {"drums":[],"decorations":[]}
        ], [{"drums":[],"decorations":[]}, {"drums":[],"decorations":[]}
        ]]}*/}});

        setEditComponent("score-component", "score-component-0")
        renderComponent("score-component", "score-component-0");
        //renderComponent("score-component", "score-component-1");
        
        // Functions for buttons, declare as window. so is accessable in their scope
        window.newScoreComponent = function() {
            // Create a new score component, render it and set it as the current edit.
            const id = createNewScoreComponent();
            renderComponent("score-component", id);
            setEditComponent("score-component", id);
        }
        window.newTextComponent = function() {
            // Create a new text component, render it and set it as the current edit.
            const id = createNewTextComponent();
            renderComponent("text-component", id);
            setEditComponent("text-component", id);
        }
        window.saveProject = function() {
            // Saves the project as a PDF with all the content, and with some metadata to allow the pdf to be imported back into the program.
            // This will open a prompt to ask the user for a file name.
            const fileName = window.prompt("File name:");
            if (fileName === null) {
                return;  // Assume doesn't want to save
            }
            nodeToPDF(document.getElementById("component-container"), fileName);
        }
        window.loadProject = function() {
            // Load a pdf containing project metadata back into the program.
            // This sends a click event to a fileinput node with id "pdfInput".
            document.getElementById('pdfInput').click();
        }
        document.getElementById('pdfInput').addEventListener('change', () => {  // The actual binding for when we need to read a pdf
            const fileInput = document.getElementById('pdfInput');
            if (fileInput.files.length === 0) {
                throw "No files submitted";
            } else if (fileInput.files.length > 1) {
                throw "Too many files submitted";
            } else {
                const reader = new FileReader();
                
                reader.onload = function (e) {  // Actually load result
                
                    // Load result into files.js
                    const binaryString = e.target.result;
                    try {
                        loadMetaFromPDFString(binaryString);
                    } catch (err) {
                        alert("Failed to load file: " + err);
                    }
                    
                    // Clear old rendered data and re-render new
                    const componentContainer = document.getElementById("component-container");
                    componentContainer.removeChild(...componentContainer.children);  // Remove all children
                    setEditComponent("", "");  // Edit nothing
                    listComponents().forEach(args => renderComponent(args[0], args[1]));  // Render components
                    
                };
                
                // Read file, this will result in the onload getting called.
                reader.readAsBinaryString(fileInput.files[0]);
            }
        });
    </script> 
</html>
